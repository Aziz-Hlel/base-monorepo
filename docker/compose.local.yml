services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: '${DB_USER:?DB_USER is required}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD is required}'
      POSTGRES_DB: '${DB_NAME:?DB_NAME is required}'
    ports:
      - ${DB_PORT:?DB_PORT is required}:5432
    volumes:
      - db_local_volume:/var/lib/postgresql/data

  redis:
    image: redis:latest

    ports:
      - ${REDIS_PORT:?REDIS_PORT is required}:6379
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password}
    volumes:
      - redis_local_volume:/data

    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-password}', '--appendonly', 'yes'] # enables persistence

  minio:
    image: quay.io/minio/minio:latest

    ports:
      - '${MINIO_PORT:?MINIO_PORT is required}:${MINIO_DOCKER_PORT:?MINIO_DOCKER_PORT is required}'
      - '${MINIO_UI_PORT:?MINIO_UI_PORT is required}:9001' # Web UI

    env_file:
      - ${PROJECT_ROOT}/config/.env.dev
      - ${PROJECT_ROOT}/.env.local
      - ${PROJECT_ROOT}/.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_local_volume:/data

    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DOCKER_PORT: ${MINIO_DOCKER_PORT}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}

    volumes:
      - ${PROJECT_ROOT}/scripts/init_minio.sh:/init_minio.sh:ro
      - ${PROJECT_ROOT}/seed/minio:/seed:ro

    entrypoint: ['/bin/sh', '/init_minio.sh']

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - '${SMTP_UI_PORT:?SMTP_UI_PORT is required}:8025' # Web UI
      - '${SMTP_PORT:?SMTP_PORT is required}:1025'

volumes:
  db_local_volume:
  redis_local_volume:
  minio_local_volume:
